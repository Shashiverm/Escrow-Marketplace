[package]
name = "soroban-job-registry-contract"
version = "0.1.0"
edition = "2021"
description = "Job Registry contract for the Stellar Freelance Escrow Marketplace"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[lib]
crate-type = ["cdylib"]

[features]
testutils = ["soroban-sdk/testutils"]
