[package]
name = "soroban-reputation-contract"
version = "0.1.0"
edition = "2021"
description = "Reputation scoring contract for the Stellar Freelance Escrow Marketplace"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]
